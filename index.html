<body>
<header class="site-header">
  <div class="logo-mark" role="img" aria-label="Yariya Collective logo"></div>
  <nav class="site-nav">
    <a href="index.html" class="active">Home</a>

    <a href="snag-a-shell.html">Snag a Shell</a>

<main>
  <div class="hero-wrap">
    <div class="page-panel">
      <h1>Welcome to Yariya Collective</h1>
      <p class="welcome-note"><em>More to come</em> &mdash; in the meantime, click the message in a bottle for a surprise note, or <a href="snag-a-shell.html">snag some shells</a> from Melly the Seal.</p>
    </div>
    <img class="melly-mascot" src="assets/melly-waving.png" alt="Melly the seal waving hello">
    <button class="bottle-button" type="button" aria-label="Open the message in a bottle">
      <img src="assets/bottle.png" alt="A message in a bottle resting on the sand">
    </button>
  </div>

  <div class="bottle-backdrop" hidden></div>
  <div class="bottle-dialog" role="dialog" aria-modal="true" aria-labelledby="bottle-title" hidden>
    <div class="bottle-paper">
      <h2 class="bottle-title" id="bottle-title">A note washed ashore</h2>
      <p class="bottle-note"></p>
    </div>
    <div class="bottle-actions">
      <button class="bottle-again" type="button">Another note</button>
      <button class="bottle-close" type="button">Close</button>
    </div>
  </div>
</main>

<body>
<header class="site-header">
  <div class="logo-mark" role="img" aria-label="Yariya Collective logo"></div>
  <nav class="site-nav">

  </nav>

<main>
  <div class="page-panel shell-panel">
    <h1>Snag a Shell</h1>
    <p>Melly&rsquo;s been collecting shells along the shore. Give her a tap and see which one she&rsquo;s found for you!</p>
    <button class="melly-button" type="button" aria-label="Tap Melly to get a shell">
      <img class="melly-shells" src="assets/melly-shells.png" alt="Melly the seal lounging on a pile of seashells">
    </button>
  </div>

  <div class="shell-backdrop" hidden></div>
  <div class="shell-dialog" role="dialog" aria-modal="true" aria-labelledby="shell-prize-title" hidden>
    <img class="shell-prize-img" src="" alt="">
    <h2 class="shell-prize-title" id="shell-prize-title"></h2>
    <p class="shell-prize-note"></p>
    <button class="shell-dialog-close" type="button">Tap again</button>
  </div>
</main>
